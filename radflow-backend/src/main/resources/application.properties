spring.application.name=radflow-backend

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/radflow_db
spring.datasource.username=${RADFLOW_DB_USERNAME}
spring.datasource.password=${RADFLOW_DB_PASSWORD}
# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true

# Server
server.port=8080